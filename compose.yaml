# Probador web de los 4 modelos de detección de fraude.
#   docker compose up -d --build     ->  http://localhost:8000
#   docker compose down
services:
  probador:
    build: .
    image: probador-fraude
    container_name: probador-fraude
    ports:
      - "8000:8000"
    restart: unless-stopped
